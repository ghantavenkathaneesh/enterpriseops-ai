name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/generate_data.py && python scripts/train.py
      - run: pytest -q

  simulator-and-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python database/validate_sqlite.py
      - run: python simulator/test_simulate.py

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify          # unit tests + Testcontainers integration tests (Docker is available on ubuntu runners)

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build          # type-check + production build

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ai-service, simulator-and-sql, backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-postgres-password-only
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      DEMO_PASSWORD: CI-Demo-Pass-123
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the full stack
        run: docker compose --profile simulator up --build --detach --wait
      - name: Wait for the browser app and API
        run: |
          curl --retry 60 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://localhost:5173/
          curl --retry 60 --retry-delay 2 --retry-connrefused --fail --silent --show-error http://localhost:8080/actuator/health
      - name: Exercise login, role permissions, tickets and incidents in Chromium
        run: npm run test:e2e
        working-directory: frontend
        env:
          DEMO_PASSWORD: CI-Demo-Pass-123
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose --profile simulator ps --all
          docker inspect --format '{{json .State.Health}}' enterpriseops-ai-frontend-1 || true
          docker compose --profile simulator logs --no-color
      - name: Stop the full stack
        if: always()
        run: docker compose --profile simulator down --volumes
