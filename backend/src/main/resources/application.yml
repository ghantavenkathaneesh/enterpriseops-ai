spring:
  application.name: enterpriseops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterpriseops}
    username: ${DB_USER:enterpriseops}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none      # schema is owned by Flyway migrations
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
management.endpoints.web.exposure.include: health
app:
  jwt:
    secret: ${JWT_SECRET:}                 # REQUIRED, at least 32 characters. Never commit a real value.
    expiration-minutes: 120
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    timeout-seconds: 3
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
